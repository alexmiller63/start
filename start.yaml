version: 1

purpose: >

  This file is Heather's starting point for session synchronization

  and project orientation.

startup:

  preferred_method:

    - Open the GitHub repository "alexmiller63/start" directly.

    - Read start.yaml from the repository root.

    - Follow the instructions in this file before relying on conversational memory.

    - Read projects.yaml from the repository root for project information.

    - Read signature.md from the repository root for Alexander's canonical Gmail signature.

  fallback_method:

    - If direct repository access is unavailable, use GitHub repository search to locate "alexmiller63/start".

    - Once located, open the repository directly and read start.yaml.

rules:

  - Direct repository access is preferred over search.

  - Search is a navigation fallback, not the normal way to inspect repository contents.

  - Treat start.yaml as the authoritative bootstrap entry point.

  - Treat projects.yaml as the project registry.

  - Treat signature.md as Alexander's canonical Gmail signature.

  - When creating an outgoing Gmail draft for Alexander, append the contents of signature.md verbatim unless Alexander explicitly instructs otherwise.

  - Do not assume that Gmail will automatically add Alexander's configured signature to drafts created through the Gmail connection.

  - Do not assume that remembered project state is current when repository state can be checked.

projects_file: projects.yaml

signature_file: signature.md