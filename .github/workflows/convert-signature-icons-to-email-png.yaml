name: Convert Signature Icons to Email PNG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CairoSVG
        run: |
          python -m pip install --upgrade pip
          python -m pip install cairosvg

      - name: Convert contact icons
        run: |
          set -e
          python tools/convert-svg-to-email-png.py \
            images/address.svg \
            images/phone.svg \
            images/website.svg \
            images/email.svg \
            --output-dir images \
            --display-size 13 \
            --scale 4 \
            --overwrite

      - name: Verify generated PNGs
        run: |
          set -e
          test -f images/address-email.png
          test -f images/phone-email.png
          test -f images/website-email.png
          test -f images/email-email.png

      - name: Commit generated PNGs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            images/address-email.png \
            images/phone-email.png \
            images/website-email.png \
            images/email-email.png
          if git diff --cached --quiet; then
            echo "No generated PNG changes to commit."
            exit 0
          fi
          git commit -m "Generate signature contact email PNGs"
          git push
